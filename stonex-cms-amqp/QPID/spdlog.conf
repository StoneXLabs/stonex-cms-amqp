# level is optional for both sinks and loggers
# level for error logging is 'err', not 'error'

# max_size supports suffix
# - T (terabyte)
# - G (gigabyte)
# - M (megabyte)
# - K (kilobyte)
# - or simply no suffix (byte)

[[sink]]
name = "console"
type = "stdout_sink_mt"
create_parent_dir = true

[[sink]]
name = "file"
type = "basic_file_sink_mt"
filename = "logs/send_log.txt"
truncate = false
create_parent_dir = true

[[logger]]
name = "ProtoClient"
sinks = ["console", "file"]
level = "trace"